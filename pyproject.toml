[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeml"
version = "0.1.0"
description = "Pokémon Stats Predictor for new generation(s)"
readme = "README.md"
requires-python = ">=3.14,<3.15"

authors = [
  { name = "PanoPepino", email = "panizofisico@gmail.com" }
]

keywords = [
  "pokemon",
  "ml",
  "xgboost",
  "cli",
  "stats-prediction",
  "catboost",
  "lightgbm"
]

dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.3,<4",
  "scipy>=1.16,<2",
  "scikit-learn>=1.7,<2",
  "catboost>=1.2.8,<2",
  "lightgbm>=4.6,<5",
  "xgboost>=3.1,<4",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13.2,<1",
  "joblib>=1.5,<2",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.4,<5",
  "ipykernel>=6.30,<8",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/PanoPepino/Pokeml"
Repository = "https://github.com/PanoPepino/Pokeml"

[project.scripts]
pokeml = "pokeml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pokeml*"]
exclude = ["tests*", "notebooks*", "datasets*", "figures*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
